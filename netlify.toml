[build]
  command = "npm run build"
  publish = ".next"

  [build.environment]
    NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les fichiers de build Next.js ont un hash dans leur nom : on peut les mettre
# en cache très longtemps sans risque.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le runtime Next.js gère déjà la revalidation du HTML (max-age=0,
# must-revalidate) : on n'y touche pas pour ne pas écraser le cache des assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
